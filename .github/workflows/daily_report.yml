name: Avito Analytics Daily

on:
  schedule:
    # 23:00 по Новосибирску (UTC+7) = 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch:   # Кнопка для ручного запуска

env:
  TZ: Asia/Novosibirsk
  REPORT_TIMEZONE: Asia/Novosibirsk
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-report:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load previous history & items cache
        uses: actions/cache@v4
        with:
          path: |
            history.json
            items_cache.json
            data/external_context.sqlite
          key: avito-data-${{ github.run_id }}
          restore-keys: |
            avito-data-
            avito-history-

      - name: Generate Avito report
        env:
          AVITO_CLIENT_ID:       ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET:   ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_USER_ID:         ${{ secrets.AVITO_USER_ID }}
          AVITO_CLIENT_ID_2:     ${{ secrets.AVITO_CLIENT_ID_2 }}
          AVITO_CLIENT_SECRET_2: ${{ secrets.AVITO_CLIENT_SECRET_2 }}
          AVITO_USER_ID_2:       ${{ secrets.AVITO_USER_ID_2 }}
        run: python avito_report.py

      - name: Export accumulated data to CSV
        run: python export_data.py

      - name: Upload report to Beget via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:       ${{ secrets.FTP_HOST }}
          username:     ${{ secrets.FTP_USER }}
          password:     ${{ secrets.FTP_PASSWORD }}
          server-dir:   ${{ secrets.FTP_REMOTE_DIR }}
          local-dir:    ./reports/
          protocol:     ftp
          port:         21
          exclude: |
            **/.git*
            **/.git*/**

      - name: Archive report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: avito-report-${{ github.run_id }}
          path: |
            reports/latest.html
            reports/chatgpt_context.md
            reports/data_exports/*.csv
          retention-days: 30
